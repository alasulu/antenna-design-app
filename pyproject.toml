[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "otahub-antenna-toolkit"
version = "0.1.0"
description = "Antenna, array and waveguide synthesis with simulator export (CST / HFSS)"
readme = "README.md"
license = {text = "MIT"}
authors = [{name = "Oğuzhan Alasulu"}]
requires-python = ">=3.10"
dependencies = ["numpy>=1.24", "scipy>=1.10", "matplotlib>=3.7"]

[project.optional-dependencies]
mesh = ["manifold3d>=3.0"]
gui = ["PySide6>=6.6", "manifold3d>=3.0"]
dev = ["pytest>=7", "manifold3d>=3.0"]

[project.urls]
Repository = "https://github.com/alasulu/antenna-design-app"

[project.scripts]
otahub = "otahub.cli.main:main"

[tool.setuptools.packages.find]
include = ["otahub*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "slow: full-wave solver applications - run by default, skip for a quick loop with -m 'not slow'",
]
addopts = "-q --tb=short"
filterwarnings = ["error::RuntimeWarning"]
