[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "otahub-antenna-toolkit"
version = "0.1.0"
description = "Antenna, array and waveguide synthesis with simulator export (CST / HFSS)"
requires-python = ">=3.10"
dependencies = ["numpy>=1.24", "scipy>=1.10", "matplotlib>=3.7"]

[project.optional-dependencies]
gui = ["PySide6>=6.6"]
dev = ["pytest>=7"]

[project.scripts]
otahub = "otahub.cli.main:main"

[tool.setuptools.packages.find]
include = ["otahub*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --tb=short"
filterwarnings = ["error::RuntimeWarning"]
