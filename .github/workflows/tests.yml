name: tests

on:
  push:
  pull_request:
  workflow_dispatch:

# a newer push makes the run for the previous one moot
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  specs:
    name: Specs (doctor + every cited case)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          cache: pip
      - run: pip install -e .
      - run: python OTA_Hub_AntennaToolkit.py doctor
      - run: python OTA_Hub_AntennaToolkit.py check

  quick:
    # the oldest Python the package claims and the newest
    name: Quick tests (not slow), Python ${{ matrix.python }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        python: ["3.10", "3.13"]
    env:
      QT_QPA_PLATFORM: offscreen
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}
          cache: pip
      - name: Qt runtime libraries
        run: sudo apt-get update && sudo apt-get install -y libegl1 libgl1 libxkbcommon0 libfontconfig1 libdbus-1-3
      - run: pip install -e ".[gui,dev]"
      - run: python -m pytest tests/ -m "not slow" -p no:cacheprovider -rs

  full:
    # the slow (full-wave solver) tests only: the quick job runs the rest beside it,
    # so the two together are the whole suite in about 30 minutes instead of 50
    name: Slow tests (full-wave solvers)
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      QT_QPA_PLATFORM: offscreen
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          cache: pip
      - name: Qt runtime libraries
        run: sudo apt-get update && sudo apt-get install -y libegl1 libgl1 libxkbcommon0 libfontconfig1 libdbus-1-3
      - run: pip install -e ".[gui,dev]"
      - run: python -m pytest tests/ -m slow -p no:cacheprovider -rs
