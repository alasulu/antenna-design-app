name: tests

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  specs:
    name: Specs (doctor + every cited case)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
      - run: pip install -e .
      - run: python OTA_Hub_AntennaToolkit.py doctor
      - run: python OTA_Hub_AntennaToolkit.py check

  quick:
    name: Quick tests (not slow)
    runs-on: ubuntu-latest
    env:
      QT_QPA_PLATFORM: offscreen
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
      - name: Qt runtime libraries
        run: sudo apt-get update && sudo apt-get install -y libegl1 libgl1 libxkbcommon0 libfontconfig1 libdbus-1-3
      - run: pip install -e ".[gui,dev]"
      - run: python -m pytest tests/ -m "not slow" -p no:cacheprovider

  full:
    name: Full suite (solvers included)
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      QT_QPA_PLATFORM: offscreen
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
      - name: Qt runtime libraries
        run: sudo apt-get update && sudo apt-get install -y libegl1 libgl1 libxkbcommon0 libfontconfig1 libdbus-1-3
      - run: pip install -e ".[gui,dev]"
      - run: python -m pytest tests/ -p no:cacheprovider
